<!DOCTYPE html>
<html lang="en" data-skin="jungle" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#E7EBE4">
<title>The Anugola Almanac — Talcher</title>
<meta name="description" content="A working almanac for one hot site in Talcher, Angul — five zones, a container orchard, an indoor room, a seed programme and a mushroom bench.">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Almanac">
<meta name="format-detection" content="telephone=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;1,6..96,400&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Cascade order is load-bearing: tokens, then base, then layout, then
     components, then per-view overrides. Nothing below tokens.css may
     hard-code a colour. -->
<link rel="stylesheet" href="src/styles/tokens.css">
<link rel="stylesheet" href="src/styles/base.css">
<link rel="stylesheet" href="src/styles/layout.css">
<link rel="stylesheet" href="src/styles/components.css">
<link rel="stylesheet" href="src/styles/views.css">
<link rel="stylesheet" href="src/styles/legacy-prose.css">

<!-- Blocking, and deliberately not inline: an inline script would force
     script-src 'unsafe-inline' across the whole app. This sets the theme
     before first paint so there is no white flash on a dark phone. -->
<script src="src/ui/theme-boot.js"></script>
</head>
<body>

<a class="skip" href="#mainarea">Skip to content</a>

<div class="offbar" id="offbar" role="status">Offline — showing the last saved copy</div>

<div class="shell">

  <!-- ═══════════════════════════ RAIL (desktop) ═══════════════════════════ -->
  <aside class="rail">
    <a class="brand" href="#today" data-act="go" data-view="today">
      <span class="mark">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M20 46h24l-3 12H23z" fill="#C3A783" stroke="#6E5537" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M32 46V24" stroke="#A9C7A2" stroke-width="3" stroke-linecap="round"/>
          <ellipse cx="22" cy="28" rx="9" ry="5.5" transform="rotate(-28 22 28)" fill="#A9C7A2" stroke="#3E5C48" stroke-width="2.4"/>
          <ellipse cx="42" cy="28" rx="9" ry="5.5" transform="rotate(28 42 28)" fill="#A9C7A2" stroke="#3E5C48" stroke-width="2.4"/>
          <ellipse cx="32" cy="16" rx="5.5" ry="8" fill="#C0D8B8" stroke="#3E5C48" stroke-width="2.4"/>
        </svg>
      </span>
      <span>
        <h1>The Anugola <em>Almanac</em></h1>
        <span>20.95° N · Talcher</span>
      </span>
    </a>

    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="railfoot" id="railfoot"></div>
  </aside>

  <!-- ═══════════════════════════════ MAIN ════════════════════════════════ -->
  <main class="main" id="mainarea">
    <div class="wrap">
      <div id="boot" class="empty" style="margin-top:60px">Loading the almanac…</div>

      <section class="view" id="v-today"></section>
      <section class="view" id="v-orchard"></section>
      <section class="view" id="v-seeds"></section>
      <section class="view" id="v-pots"></section>
      <section class="view" id="v-shrooms"></section>
      <section class="view" id="v-catalogue"></section>
      <section class="view" id="v-zones"></section>
      <section class="view" id="v-feed"></section>
      <section class="view" id="v-bags"></section>
      <section class="view" id="v-climate"></section>
      <section class="view" id="v-care"></section>
      <section class="view" id="v-buy"></section>
      <section class="view" id="v-settings"></section>
    </div>
  </main>
</div>

<!-- ═══════════════════════════ PHONE CHROME ═══════════════════════════════ -->
<nav class="tabbar" id="tabbar" aria-label="Sections"></nav>

<div class="moresheet" id="moresheet">
  <div class="moreinner">
    <div class="moregrab"></div>
    <div class="moregrid" id="moregrid"></div>
  </div>
</div>

<!-- ══════════════════════════ COMMAND PALETTE ═════════════════════════════ -->
<div class="pal" id="pal" role="dialog" aria-modal="true" aria-label="Search everything">
  <div class="palbox">
    <input class="palq" id="palq" type="text" placeholder="Search plants, trees, sowings, screens…"
           autocomplete="off" autocorrect="off" spellcheck="false" role="combobox"
           aria-expanded="true" aria-controls="pallist">
    <div class="pallist" id="pallist" role="listbox"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="src/main.js"></script>

<noscript>
  <div class="empty" style="margin:40px">
    The Almanac is a calculator as much as a reference — watering intervals, thermal time,
    sun geometry and fertiliser doses are all computed. It needs JavaScript enabled.
  </div>
</noscript>

</body>
</html>
