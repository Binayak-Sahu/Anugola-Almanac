# The Anugola Almanac — Netlify configuration.
# Static site, no build step for the app itself. Drag the folder onto
# netlify.com/drop, or connect the repository.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ---------------------------------------------------------------------------
# Security headers
#
# v9 needed script-src 'unsafe-inline' because the entire application lived in
# an inline <script> and the theme was set by an inline snippet. v10 has no
# inline script at all — theme-boot.js is a real file — so the policy can be
# tightened to 'self'. That is a meaningful upgrade: with 'unsafe-inline' a
# single injected string in any user-entered plant note could execute.
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(self), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# The service worker must never be cached, or an update can never reach a
# device that already has the old one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# index.html must revalidate, or a deploy never reaches an installed PWA.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# The module graph and the knowledge base are versioned by the service worker
# cache name, so they can be cached hard by the CDN.
[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Deep links (#today, #orchard/mango) are hash routes, so every path must
# resolve to the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
