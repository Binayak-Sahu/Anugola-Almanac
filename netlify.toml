# The Angul Almanac — Netlify configuration
# Drag this whole folder onto netlify.com/drop. No build, no npm install.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"

# The service worker must never be cached, or an update can never reach you.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
